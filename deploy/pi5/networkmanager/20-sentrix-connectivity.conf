# /etc/NetworkManager/conf.d/20-sentrix-connectivity.conf
#
# Connectivity check: what makes Wi-Fi -> 4G failover automatic. A device
# that is up but cannot reach the Internet (hotspot with mobile data off,
# router without uplink) gets +20000 on its route metric, so the modem's 700
# wins until the check passes again. Off unless a uri is set.

[connectivity]
enabled=true
uri=http://nmcheck.gnome.org/check_network_status.txt
response=NetworkManager is online
interval=30
