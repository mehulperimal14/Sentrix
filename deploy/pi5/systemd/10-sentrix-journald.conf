# /etc/systemd/journald.conf.d/10-sentrix.conf
#
# Logs survive a crash (persistent) but cannot fill the microSD card: the
# journal keeps at most 200 MB, leaves 1 GB free for evidence, and drops
# anything older than a month. Writes are batched to spare the card.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=200M
SystemKeepFree=1G
SystemMaxFileSize=20M
MaxRetentionSec=1month
SyncIntervalSec=5m
RateLimitIntervalSec=30s
RateLimitBurst=2000
