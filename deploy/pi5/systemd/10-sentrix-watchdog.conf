# /etc/systemd/system.conf.d/10-sentrix-watchdog.conf
#
# systemd pets the board's hardware watchdog; if systemd itself (or the
# kernel) hangs, the watchdog reboots the unit. Pair with
# kernel_watchdog_timeout=10 in /boot/firmware/config.txt, which arms the
# watchdog during boot until systemd takes it over. The BCM2835-family timer
# tops out near 16 s, so stay at 10 s (check the Pi 5 with `wdctl`).
# Not enabled by default on Raspberry Pi OS.

[Manager]
RuntimeWatchdogSec=10s
RebootWatchdogSec=2min
