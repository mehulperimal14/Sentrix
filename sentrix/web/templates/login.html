<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTRIX Security — Login</title>
  <meta name="description" content="SENTRIX Authentication">
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
</head>
{#- The device admin's sign-in (SENTRIX_PASSWORD). Never served through the
    Portal: Portal users sign in on the Portal. -#}
<body class="standalone">
  {% if test_mode %}
  <div class="test-mode-banner" role="note">TEST MODE · SENTRIX DEMO, NOT A REAL EMERGENCY SERVICE.</div>
  {% endif %}

  <div class="card login-card">
    <div class="login-logo">⬡</div>
    <div class="login-title">SENTRIX</div>

    <form class="login-form" action="{{ url('/login') }}" method="POST">
      <div class="form-group">
        <input type="password" name="password" class="form-input" placeholder="Enter Password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Authenticate</button>

      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
    </form>
  </div>

</body>
</html>
