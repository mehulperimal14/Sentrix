[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentrix"
version = "3.0.0"
description = "Multimodal edge threat intelligence and physical security system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kartik Garg" },
    { name = "Akshay Ranveer" },
    { name = "Prashant Gagneja" },
    { name = "Harshit Mishra" },
    { name = "Mehul Perimal" },
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "sqlalchemy>=2.0.30",
    "numpy>=1.26.4",
    "opencv-python>=4.10.0",
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "timm>=1.0.0",
    "xgboost>=2.1.1",
    "scikit-learn>=1.5.1",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "insightface>=1.0.1",
    "onnxruntime>=1.18.0",
]

[project.optional-dependencies]
# Face recognition (insightface, onnxruntime) is a core dependency since 1.0
# ships wheels; GPU users can swap onnxruntime for onnxruntime-gpu.
reid = ["torchreid>=1.4.0"]
voice = ["vosk>=0.3.45"]
alerts = ["twilio>=9.0.0"]
notebooks = ["jupyterlab>=4.2.0", "matplotlib>=3.9.0", "seaborn>=0.13.0"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.6.0"]

[project.scripts]
sentrix = "sentrix.app:main"

[tool.setuptools.packages.find]
include = ["sentrix*"]

[tool.setuptools.package-data]
sentrix = ["web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "training/runs", "Capstone Docs", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
